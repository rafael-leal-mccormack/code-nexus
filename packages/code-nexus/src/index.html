<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Stencil Component Starter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap"
    />
    <script type="module" src="/build/codenexus.esm.js"></script>
    <script nomodule src="/build/codenexus.js"></script>
    <style>
      html, body {
        height: 100%;
        margin: 0px;
        box-sizing: border-box;
      }

      body {
        padding: 1rem;
      }

      .hide {
        display: none;
      }
    </style>
  </head>
  <body>
    <button id="show-nexus" style="margin-bottom: 8px">Nexus</button>
    <button id="show-panels">Panels</button>
    <code-nexus class="show"></code-nexus>
    <nexus-panel class="hide" style="max-height: 500px" panel-name="Javascript hehe"></nexus-panel>
    <script>
      const showNexusButton = document.querySelector('#show-nexus');
      const showPanelsButton = document.querySelector('#show-panels');
      const nexus = document.querySelector('code-nexus');
      const panel = document.querySelector('nexus-panel');

      showNexusButton.addEventListener('click', () => {
        nexus.classList.add('show');
        nexus.classList.remove('hide')
        panel.classList.remove('show')
        panel.classList.add('hide')
      })

      showPanelsButton.addEventListener('click', () => {
        panel.classList.add('show');
        panel.classList.remove('hide')
        nexus.classList.remove('show')
        nexus.classList.add('hide')
      })
    </script>
  </body>
</html>
